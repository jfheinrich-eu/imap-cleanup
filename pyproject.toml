[tool.poetry]
name = "imap-cleanup"
version = "0.1.0"
description = "A command-line tool to manage and clean up IMAP mailboxes based on configurable retention rules. Supports interactive configuration and multi-account management."
authors = ["Joerg Heinrich <contact@jfheinrich.eu>"]
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Email"
]
packages = [
    { include = "imap_cleanup", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.8"
rich = "*"
tqdm = "*"
questionary = "*"
toml = "*"

[tool.poetry.scripts]
imap-cleanup = "imap_cleanup.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
coverage = "*"
build = "*"
twine = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --tb=short --strict-markers --cov=imap_cleanup --cov-report=term-missing --cov-report=html:coverage"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = [
    "tests"
]
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
branch = true
source = [
    "imap_cleanup"
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.poetry.source]]
name = "pypi-public"
url = "https://pypi.org/simple/"

[tool.poetry.requires-plugins]
poethepoet = ">=0.35"

[tool.poe.tasks]
test = "pytest"
build = "poetry build"
publish = "poetry publish"
serve = "python -m http.server -d ./coverage"
